<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073640">
<title>Uma carta para você</title>
<style>
:root{--bg:#073640;--card:#0b414c;--text:#f5fafb;--muted:#b9cdd1;--line:rgba(255,255,255,.13);--button:#f3f7f8;--buttonText:#073640}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100svh;background:radial-gradient(circle at 50% -10%,rgba(255,255,255,.09),transparent 38%),var(--bg);color:var(--text)}
.page{width:min(100% - 20px,620px);min-height:100vh;min-height:100svh;margin:auto;display:flex;align-items:center;justify-content:center;padding:24px 0}
.card{width:100%;padding:34px 28px;border-radius:28px;background:rgba(11,65,76,.94);border:1px solid var(--line);box-shadow:0 25px 70px rgba(0,0,0,.28);text-align:center}
.mark{width:46px;height:46px;margin:0 auto 22px;display:grid;place-items:center;border-radius:15px;background:rgba(255,255,255,.08);font-size:21px}
h1{margin:0;font-size:clamp(31px,8vw,48px);line-height:1.04;letter-spacing:-.045em;font-weight:650}
.intro{max-width:430px;margin:17px auto 30px;color:var(--muted);font-size:16px;line-height:1.6}
.label{display:block;margin-bottom:8px;color:var(--text);font-size:15px;font-weight:600}
.hint{margin:0 0 13px;color:var(--muted);font-size:13px}
.form{display:flex;flex-direction:column;gap:11px}
input{width:100%;height:54px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.07);color:var(--text);text-align:center;font-size:20px;letter-spacing:.16em;outline:none;-webkit-appearance:none}
input:focus{border-color:rgba(255,255,255,.4);box-shadow:0 0 0 4px rgba(255,255,255,.055)}
button,.open{width:100%;height:54px;border:0;border-radius:17px;background:var(--button);color:var(--buttonText);font:650 15px inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
button:active,.open:active{transform:scale(.985)}
.error{display:none;margin-top:13px;color:#ffd6d6;font-size:13px}
.success{display:none}.success.show{display:block;animation:appear .45s ease both}
.hidden{display:none}.success .mark{margin-bottom:20px}
.success h2{margin:0 0 12px;font-size:30px;letter-spacing:-.035em}
.success p{margin:0 auto 24px;max-width:420px;color:var(--muted);line-height:1.6;font-size:15px}
.footer{margin-top:22px;color:rgba(255,255,255,.42);font-size:11px}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:480px){.card{padding:31px 20px;border-radius:25px}.intro{font-size:15px}}
</style>
</head>
<body>
<main class="page">
<section class="card" id="gate">
<div class="mark">♡</div>
<h1>Uma carta para você.</h1>
<p class="intro">Algumas coisas eu precisava deixar escritas.</p>
<form class="form" id="passwordForm">
<div>
<label class="label" for="password">Teu aniversário</label>
<p class="hint">Digite somente números.</p>
<input id="password" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="DDMMAAAA" aria-label="Teu aniversário" required>
</div>
<button type="submit">Continuar</button>
</form>
<div class="error" id="error">A senha não está correta.</div>
<div class="footer">Uma página feita especialmente para esta carta.</div>
</section>
<section class="card success" id="success" aria-hidden="true">
<div class="mark">✓</div>
<h2>Acesso liberado.</h2>
<p>Agora você pode abrir a carta.</p>
<a class="open" href="https://docs.google.com/document/d/1-l4Y8YHrgp519M8UDSPbD_oLgZ7U9MM5aRmUWFJ9zzg/edit?usp=sharing" target="_blank" rel="noopener">Abrir a carta</a>
<div class="footer">Você pode voltar para esta página quando quiser.</div>
</section>
</main>
<script>
const PASSWORD="25102008";
const form=document.getElementById("passwordForm"),input=document.getElementById("password"),error=document.getElementById("error"),gate=document.getElementById("gate"),success=document.getElementById("success");
input.addEventListener("input",()=>{input.value=input.value.replace(/\D/g,"").slice(0,8);error.style.display="none"});
form.addEventListener("submit",e=>{e.preventDefault();if(input.value===PASSWORD){gate.classList.add("hidden");success.classList.add("show");success.setAttribute("aria-hidden","false");window.scrollTo({top:0,behavior:"smooth"})}else{error.style.display="block";input.select()}});
</script>
</body>
</html>
